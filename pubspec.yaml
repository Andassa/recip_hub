name: recipe_hub
description: "Recipe Hub — application de recettes de cuisine pixel-perfect."
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  go_router: ^16.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.2.1
  flutter_hooks: ^0.21.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/capture/
    - assets/capture/receip ingredient/
    - assets/capture/receip_ingredient/
    - google_fonts/
